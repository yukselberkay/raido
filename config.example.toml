# Copy to ~/.config/raido/config.toml (Linux and macOS).
# Or set XDG_CONFIG_HOME and use $XDG_CONFIG_HOME/raido/config.toml.
theme = "visual-studio-dark"
# Dark: vscode-dark-2026, dracula, nord, one-dark, gruvbox-dark, tokyo-night,
# catppuccin-mocha, solarized-dark, monokai, github-dark, phosphor, amber.
# Light: visual-studio-light, vscode-light-2026, github-light, one-light,
# solarized-light, catppuccin-latte, gruvbox-light.
# Runtime switch: :theme dracula; :themes lists all. Drop NAME.toml or a VS Code
# NAME.json into ~/.config/raido/themes/ to add a theme without rebuilding.
sidebar_width = 29
# In a small window the sidebar hides by itself, so the code keeps its room: when
# the panes would have under 70 columns beside it (under 99 at width 29) or the
# window is under 16 rows; its Git section under 24 rows. It comes back with room;
# Ctrl-e opens it meanwhile, Ctrl-b s keeps it. false keeps it but under 70 columns.
auto_hide_sidebar = true
tab_width = 4
# Language-aware typing: Enter indents after `def f():` / `{` / `then`, dedents
# after `return`; closers and Python's else:/except: line up with their opener.
smart_indent = true
# Brackets and quotes close themselves; typing the closer steps over it.
auto_pairs = true
# Suggestions pop up after two letters of a word: the language server's, or the
# language's keywords and words from your open files. Tab accepts.
autocomplete = true
relative_numbers = false
# A language server's error or warning shows its message, faint, after the line it
# marks with a dot (the cursor's line has it at the bottom of the pane instead).
inline_diagnostics = true
# File-type icons in the explorer. true: Nerd Font glyphs when a Nerd Font is
# available (Omarchy has one), else colored markers. "nerd"/"basic" force a style;
# false hides them.
icons = true
# Open the Git pane (all branches, commit graph, details) at startup; :git or
# Ctrl-b G opens it any time.
git_pane = false
# Reopen each project as you left it: panes, unsaved text, terminal output, AI
# conversations. Saved in <project>/.raido/ (Git repositories, or :session save).
restore_session = true
# Raido's font while it runs, put back when it exits. macOS Terminal switches Raido's
# tab to it when it's installed; other terminals, or a missing font, keep the
# terminal's own (set it there, or with :font family). "" always keeps it.
# scripts/install.sh installs JetBrains Mono Nerd Font.
font = "JetBrainsMono Nerd Font Mono"
# Text size in points, decimals allowed (12.5): 14 with that font, else the terminal's
# own. In macOS Terminal, Ctrl-b + / - and :font size keep the size here for you;
# Ctrl-b 0 removes it.
# font_size = 14
# Where AI panes open: "right" (side by side) or "below" (stacked).
ai_split = "right"
# Teach your AI agents about Raido (an Agent Skills skill for every project; kept
# current at startup when an AI agent is installed, and when you launch one).
ai_skill = true
# Start AI agents without them asking before each command or edit: Claude Code in
# its auto mode, Codex, Gemini CLI and Antigravity in their yolo modes. false starts
# each in its own default mode. Your own [ai.<name>] launchers run as you wrote them.
ai_auto_mode = true
# Who answers in the interactive documentation (Ctrl-b /, :ask): "auto" (the first
# installed of Claude Code, Codex, Gemini, Antigravity, OpenCode, a local model),
# one of those ("claude", "codex", "gemini", "agy", "opencode", "local"), with
# ":model" if you like ("claude:opus"), a list to try in order, or "off". When one
# can't answer (signed out, out of quota), the next installed one on the list does.
docs_ai = "auto"
# A sound when an AI pane finishes a prompt (or stops to ask you something):
# "default" (macOS Glass, the desktop's "complete" sound on Linux, Windows' notify
# sound), "off", "bell" (the terminal's bell), a system sound name (macOS "Hero",
# "Ping"…; Windows "Windows Ding", "chimes"…) or a sound file. :sound plays it.
ai_sound = "default"
# Ctrl-b v reviews what AI panes changed, like VS Code's agent edits: keep or undo
# each change. Raido snapshots the project with Git into its own store while agents
# run (never your repository). false turns it off.
review_changes = true
# macOS: ⌘V pastes a screenshot into an AI pane. While one is open, a screenshot put
# on the clipboard is saved and, while Raido is in front, its path added beside the
# image, since the terminal's ⌘V pastes only text; the agent attaches it. Other apps
# (a browser, GitLab) get the screenshot exactly as copied; text you copy is never
# touched. false turns it off.
paste_screenshots = true
# Gitignored files the review tracks anyway, by name ("*" is any characters; a
# pattern with / matches the path from the project folder). Files over 2 MB and
# dependency, build and cache folders are left out. [] tracks none.
review_ignored = ["*.md", "*.txt"]
# Mouse wheel scrolls the pane (or explorer, guide) under the pointer; a click
# focuses a pane, puts the editor cursor there, or opens an explorer entry. While
# Raido has the mouse, Ctrl-b y hands it to the terminal for selecting and copying
# (again to take it back), as does copy view (Ctrl-b Z); or hold your terminal's
# bypass key (Option in iTerm2, Shift in most Linux terminals).
mouse = true
# shell = "/bin/zsh"

# Language servers start automatically for Rust, Go, Python, C and C++ files,
# TypeScript and JavaScript (typescript-language-server, with TypeScript 6), shell
# scripts (bash-language-server, with ShellCheck and shfmt), YAML and JSON
# (yaml-language-server, VS Code's vscode-json-language-server), Dockerfiles and
# Docker Compose files (Docker's docker-language-server), and x86, ARM and RISC-V
# assembly (asm-lsp: without a .asm-lsp.toml, only for files it reads right, GNU as
# for this computer's CPU; :lsp says what to write for the others).
lsp_enabled = true
# YAML and JSON files are checked against the schemas published for them
# (SchemaStore's, Kubernetes'), which their servers download as needed; false keeps
# them offline, checking only the syntax.
lsp_schemas = true
# On save, organize imports and format with the language server, as VS Code does
# for Go (gopls: goimports + gofmt). Keys: go, rust, python, c, typescript, shell
# (shfmt), yaml, docker (Compose files), and json (laid out by Raido itself, no
# server needed).
# [] turns it off.
format_on_save = ["go"]
# How lines end in the files Raido saves: "lf" (\n, as on Linux and macOS; a file
# with Windows line endings gets \n when saved), "crlf" (\r\n) or "auto" (each
# file's own, what most of its lines use). Windows .bat/.cmd files keep theirs.
# Pastes take the file's line breaks; copies leave Raido with \n.
line_endings = "lf"
# Optional: choose a different server per language (keys: rust, go, python, c,
# typescript, shell, yaml, json, docker, asm).
# [lsp.python]
# program = "pylsp"
# args = []

# Bring your own AI / local LLM: each [ai.NAME] appears in the AI launcher
# (Ctrl-b a, keys 7–9) and as :ai NAME [model]. [ai.local] backs key 5 and
# :ai local; without it Raido uses Ollama or LM Studio if installed.
# [ai.local]
# program = "ollama"
# args = ["launch", "claude"]        # Claude Code on a local model (Ollama 0.15+)
#
# [ai.aider]
# program = "aider"
# args = ["--model", "openai/{model}"]
# model = "qwen2.5-coder"
# env = { OPENAI_API_BASE = "http://localhost:8080/v1", OPENAI_API_KEY = "local" }

# Your own model server, Ollama or vLLM, on another machine: OpenCode (key 6) and
# the Local LLM (key 5) run on its models, and review_ai = "local" asks it.
# [model_server]
# url = "http://gpu-box:11434"       # Ollama; vLLM: "http://gpu-box:8000"
# kind = "auto"                      # or "ollama", "vllm"
# tunnel = "gpu-box"                 # through SSH; url as seen from gpu-box
# key_env = "VLLM_API_KEY"           # the variable holding its API key

# Command plugins launch ONLY when you type :run NAME.
# Arguments are passed directly, with no shell interpolation.
[plugins.check]
program = "cargo"
args = ["check", "--all-targets"]

[plugins.test]
program = "cargo"
args = ["test"]

[plugins.git]
program = "git"
args = ["log", "--graph", "--oneline", "--all", "-30"]

# No API keys belong in this file. Sign in within the AI CLI, or configure
# its documented environment/credential manager outside Raido.
