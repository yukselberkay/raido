# GitHub Light — Raido adaptation. See themes/README.md for palette credits.
# Built in: :theme github-light. Copy under a new name to customize.
background = "#ffffff"
foreground = "#1f2328"
muted = "#59636e"
accent = "#0969da"
secondary = "#8250df"
warning = "#9a6700"
border = "#d0d7de"
selection = "#ddf4ff"
# ANSI 0–7, then bright 8–15: GitHub Light's terminal colors.
ansi = [
  "#24292f", "#cf222e", "#116329", "#4d2d00", "#0969da", "#8250df", "#1b7c83", "#6e7781",
  "#57606a", "#a40e26", "#1a7f37", "#633c01", "#218bff", "#a475f9", "#3192aa", "#8c959f",
]

[syntax_colors]
comment = "#6e7781"
keyword = "#cf222e"
function = "#8250df"
type = "#953800"
string = "#0a3069"
number = "#0550ae"
constant = "#0550ae"
operator = "#cf222e"
variable = "#1f2328"
